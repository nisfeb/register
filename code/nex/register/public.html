<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/apps/register/favicon.png">
<link rel="apple-touch-icon" href="/apps/register/favicon.png">
<title>Register for the Baby Steps Camino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Open+Sans:wght@400;600;700&family=Poppins:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/apps/register/public.css">
</head>
<body>
<div id="busy" class="busy" hidden></div>
<header>
  <a class="brand" href="https://www.babystepscamino.com/home">
    <img src="/apps/register/logo.png" alt="The Baby Steps Camino" width="400" height="400">
  </a>
  <nav class="site" aria-label="Baby Steps Camino">
    <a href="https://www.babystepscamino.com/home">HOME</a>
    <a href="https://www.babystepscamino.com/resources">FAQs</a>
    <a href="https://www.babystepscamino.com/blog-1">Blog</a>
    <a href="https://www.babystepscamino.com/about-camino">About</a>
    <a href="https://www.babystepscamino.com/gallery">Gallery</a>
    <a href="https://www.babystepscamino.com/order-of-malta">Order of Malta</a>
    <a href="https://www.babystepscamino.com/contact-2">Contact</a>
  </nav>
  <div class="tools">
    <button type="button" id="edit-copy" class="editcopy" hidden>Edit text</button>
  </div>
</header>
<div id="prompt" class="prompt" hidden>
  <label for="actor-name">Who is making changes? Your name goes in the history.</label>
  <input type="text" id="actor-name" autocomplete="name" maxlength="64">
  <button type="button" id="actor-save" class="btn small">Save</button>
  <button type="button" id="actor-cancel" class="btn quiet small">Cancel</button>
</div>
<div id="steps" class="steps" hidden></div>
<div id="banner" class="banner" hidden></div>
<main id="view"><div class="loading"><span class="spin"></span>Loading</div></main>
<footer><p class="muted">Sovereign Military Hospitaller Order of Saint John of Jerusalem of Rhodes and of Malta, American Association. A 501(c)(3) organization.</p></footer>
<script src="/apps/register/public.js"></script>
</body>
</html>

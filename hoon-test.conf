# hoon-test-kit: what register's Hoon suite builds, and where it goes on
# the test desk. Sourced by bash and parsed by python, so plain KEY="value"
# lines only. Paths are relative to this file.
#
# register's library is import-free: no /< and no /&, so it needs none of
# the grubbery translation and DIALECT stays at its clay default. The
# nexus (code/nex/register/app.hoon) is NOT here yet; putting it under
# test means DIALECT=grubbery, a PRELUDE and SHIP_FILES, and driving its
# fibers with hoon/fiber-test.hoon. See docs/hoon-testing.md.

# the test desk: never register's own
DESK=register-test

# the library under test
LIBS="code/lib/register.hoon"

# every *.hoon here lands in tests/lib/
TESTS=tests/lib

# no fixtures: the suite builds everything it needs from the library
FILES=""

# marks copied from %base at setup
MARKS="json mime"
